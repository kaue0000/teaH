services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./backend/treinamento/output/merged:/models/llama32-suporte:ro
      - ./backend/treinamento/Modelfile:/models/Modelfile:ro

  trainer:
    profiles: ["training"]
    build:
      context: ./backend/treinamento
    environment:
      HF_TOKEN: ${HF_TOKEN}
      BASE_MODEL: ${BASE_MODEL:-meta-llama/Llama-3.2-1B-Instruct}
    volumes:
      - ./backend/treinamento:/workspace
      - huggingface-cache:/root/.cache/huggingface

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run start:dev"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2-suporte
      OLLAMA_TIMEOUT_MS: 120000
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - ollama

volumes:
  backend_node_modules:
  ollama-data:
  huggingface-cache: